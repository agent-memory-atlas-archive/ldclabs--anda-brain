name: Test
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: anda-brain
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: anda-brain
      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 protobuf-compiler
      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y --no-progress
      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install Rust stable
        run: rustup update --no-self-update stable
      - name: Run clippy
        run: cargo clippy -p anda_brain --all-targets --all-features -- -D warnings
      - name: Run tests
        env:
          # CognitiveMemory 2.1 schema validation exceeds Rust's 2 MiB test
          # thread default in debug builds on the supported CI platforms.
          RUST_MIN_STACK: 16777216
        run: cargo test --workspace --all-features -- --nocapture
      - name: Check optional library surfaces
        env:
          RUST_MIN_STACK: 16777216
        run: |
          cargo test -p anda_brain --lib
          cargo test -p anda_brain --lib --features wiki
          cargo test -p anda_brain --lib --features mcp
          cargo test -p anda_brain --lib --features learning,experiments
  mib-regression:
    name: MIB public product regression (no model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: anda-brain
      - uses: actions/checkout@v4
        with:
          repository: ldclabs/MIB
          # Follow MIB's maintained regression runner; MIB_REF can pin a replay.
          ref: ${{ vars.MIB_REF || 'main' }}
          path: mib
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MIB runner
        working-directory: mib
        run: python -m pip install '.[test]'
      - name: Run migrated public regressions
        working-directory: mib
        run: python scripts/check-brain-product-regression.py --output-dir '${{ runner.temp }}/brain-product-regression'
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mib-brain-product-regression
          path: ${{ runner.temp }}/brain-product-regression
  test-cli:
    name: Test anda-cli (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anda-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: anda-cli/go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Run tests
        run: go test ./...
  test-worker:
    name: Test anda-brain-worker (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anda-brain
    steps:
      - uses: actions/checkout@v4
        with:
          path: anda-brain
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: anda-brain/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm --filter @ldclabs/anda-brain-worker check
