[package]
name = "migrate-draft-space"
version = "0.1.0"
edition = "2024"
publish = false
description = "One-off: move a Space written under the cognitive-memory 2.1.0 draft onto a fresh KIP 2.0 Nexus"

# A standalone tool, not a member of the repository workspace: it links the
# 0.13 engine that wrote the draft Space next to the 0.14 engine that rebuilds it.
[workspace]

[dependencies]
# The engine that wrote the draft Space (read side).
nexus13 = { package = "anda_cognitive_nexus", version = "=0.13.4" }
db13 = { package = "anda_db", version = "=0.13.2", features = ["full"] }
kip13 = { package = "anda_kip", version = "=0.13.1" }
store13 = { package = "anda_object_store", version = "=0.13.0" }
# The KIP 2.0 engine the Space is rebuilt on (write side).
anda_cognitive_nexus = "0.14.0"
anda_db = { version = "0.14", features = ["full"] }
anda_kip = "=0.14.0"
anda_object_store = "0.14"
object_store = { version = "0.14", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Until 0.14 is published, the write side builds from the sibling checkout, as
# the repository workspace does.
[patch.crates-io]
anda_cognitive_nexus = { path = "../../../anda-db/rs/anda_cognitive_nexus" }
anda_db = { path = "../../../anda-db/rs/anda_db" }
anda_db_schema = { path = "../../../anda-db/rs/anda_db_schema" }
anda_db_tfs = { path = "../../../anda-db/rs/anda_db_tfs" }
anda_kip = { path = "../../../anda-db/rs/anda_kip" }
anda_object_store = { path = "../../../anda-db/rs/anda_object_store" }
