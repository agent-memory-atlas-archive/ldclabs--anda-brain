packages:
  - 'anda-brain-worker'
allowBuilds:
  # Build script not needed; denied so `pnpm install` stays non-interactive in CI.
  '@whiskeysockets/baileys': false
  esbuild: true
  koffi: true
  protobufjs: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  # This coordinated KIP 2.0 release is newer than pnpm's release-age gate.
  - '@ldclabs/kip-do@0.13.1'
  - '@ldclabs/kip-do@0.13.1'
onlyBuiltDependencies:
  - esbuild
