packages:
  - 'anda-brain-worker'
allowBuilds:
  # Build script not needed; denied so `pnpm install` stays non-interactive in CI.
  '@whiskeysockets/baileys': false
  esbuild: true
  koffi: true
  protobufjs: true
  sharp: true
  workerd: true
# pnpm refuses versions published less than a day ago. The KIP toolkit and its
# engine ship release-for-release with this repository, so trust them by name.
minimumReleaseAgeExclude:
  - '@ldclabs/kip-do'
  - '@ldclabs/kip-lang'
onlyBuiltDependencies:
  - esbuild
